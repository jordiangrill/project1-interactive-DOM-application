<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>F1 game</title>
    <link rel="stylesheet" href="./styles/style.css" />
  </head>

  <body>
    <!--Start Screen-->
    <div id="start-screen">
      <h1>Start your engines!</h1>

      <section>
        <div id="game-preview">
          <img src="Images/Antonelli.png" />
        </div>

        <div id="play-button">
          <button>Race</button>
        </div>
      </section>
    </div>

    <!--Game Area-->
    <div id="game-area">
      <div id="track">
        <!--- race track-->
      </div>
      <div id="player">
        <!---Antonelli img-->
      </div>
      <div id="rivals">
        <!---opponents imgs (21 drivers or 11 teams?)-->
      </div>
      <div id="track-elements">
        <!--batteries and oil slicks or puddles-->
      </div>
      <div id="score">
        <!---position on track-->
      </div>
    </div>

    <!--Finish game-->
    <div id="finish-game">
      <div id="result">
        <!---message about the result-->
        <p>You finished in X position!</p>
      </div>
      <div id="play-again">
        <!--race again-->
        <button>Try again!</button>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>F1 game</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <!--Start Screen-->
    <div id="start-screen">
      <h1>Welcome to my first F1 game!</h1>

      <section>
        <div id="game-preview">
          <img src="Images/grid.png" />
        </div>

        <div id="play-button">
          <button id="start-button">Race start</button>
        </div>
      </section>
    </div>

    <!--Game Area-->
    <div id="game-area">
      <div id="track">
        <div id="race-status" aria-live="polite">
          <span id="race-position">P20/20</span>
          <span id="race-speed">Speed 50 km/h</span>
        </div>
        <img id="road" src="Images/track.png" alt="Race track" />
        <img id="player" src="Images/Antonelli.png" alt="Antonelli car" />
        <img id="rivals" src="Images/Hamilton.png" alt="Hamilton car" />
        <img id="battery" src="Images/battery.png" alt="F1 battery" />
        <img id="oil" src="Images/Oil.png" alt="Oil engine" />

        <!--- score-->
      </div>
    </div>

    <!--Finish game-->
    <div id="finish-game">
      <div id="result">
        <h1 id="result-message">Race over!</h1>
        <img src="Images/finish.png" alt="Finish line" />
      </div>
      <div id="play-again">
        <button id="restart-button">Try again!</button>
      </div>
    </div>

    <audio
      id="race-audio"
      src="./Audio/driving-to-the-night.ogg"
      loop
      preload="auto"
    ></audio>

    <script src="./javascript.js"></script>
  </body>
</html>
